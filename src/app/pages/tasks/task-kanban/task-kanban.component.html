<p-dialog [(visible)]="visible" [style]="{ width: '800px' }" header="Task Kanban 📋" [modal]="true" (onHide)="onHide()">
    <div class="flex gap-4">
        <!-- To Do Column -->
        <p-panel header="📝 To Do" class="flex-1">
            <div
                cdkDropList
                #todoList="cdkDropList"
                [cdkDropListData]="todoTasks()"
                [cdkDropListConnectedTo]="['done-list']"
                class="kanban-list"
                id="todo-list"
                (cdkDropListDropped)="drop($event)">
                <p-card *ngFor="let task of todoTasks()" 
                    cdkDrag
                    (dblclick)="onTaskDoubleClick(task)"
                    class="kanban-item mb-3">
                    <ng-template pTemplate="header">
                        <div class="flex justify-content-between align-items-center">
                            <div class="font-bold">{{ task.name }}</div>
                            <div class="emoji">❌</div>
                        </div>
                    </ng-template>
                    <p class="text-gray-600">{{ task.description }}</p>
                    <ng-template pTemplate="footer">
                        <p-tag severity="info" [value]="'🏷️ ' + task.category"></p-tag>
                    </ng-template>
                </p-card>
            </div>
        </p-panel>

        <p-divider layout="vertical"></p-divider>

        <!-- Done Column -->
        <p-panel header="✅ Done" class="flex-1">
            <div
                cdkDropList
                #doneList="cdkDropList"
                [cdkDropListData]="doneTasks()"
                [cdkDropListConnectedTo]="['todo-list']"
                class="kanban-list"
                id="done-list"
                (cdkDropListDropped)="drop($event)">
                <p-card *ngFor="let task of doneTasks()" 
                    cdkDrag
                    (dblclick)="onTaskDoubleClick(task)"
                    class="kanban-item mb-3">
                    <ng-template pTemplate="header">
                        <div class="flex justify-content-between align-items-center">
                            <div class="font-bold">{{ task.name }}</div>
                            <div class="emoji">✅</div>
                        </div>
                    </ng-template>
                    <p class="text-gray-600">{{ task.description }}</p>
                    <ng-template pTemplate="footer">
                        <p-tag severity="info" [value]="'🏷️ ' + task.category"></p-tag>
                    </ng-template>
                </p-card>
            </div>
        </p-panel>
    </div>
</p-dialog>
